name: Expand handoff package

on:
  push:
    paths:
      - vt-position-talent-management-handoff.zip

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand verified handoff archive
        run: |
          unzip -oq vt-position-talent-management-handoff.zip -d .
          rm vt-position-talent-management-handoff.zip
          rm .github/workflows/unpack-handoff.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete VT system handoff"
          git push
